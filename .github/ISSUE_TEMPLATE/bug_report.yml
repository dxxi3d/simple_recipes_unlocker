name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: dropdown
    id: loader
    attributes:
      label: Mod Loader
      description: Which mod loader are you using?
      options:
        - Fabric
        - NeoForge
        - Forge
        - Quilt
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: Minecraft Version
      placeholder: "e.g. 1.21.4"
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: Mod Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Install the mod
        2. Join a world
        3. ...
    validations:
      required: true
  - type: input
    id: logs
    attributes:
      label: Crash Report / Log URL
      description: Please upload crash-reports or latest.log to https://mclo.gs or Pastebin and link it here.
      placeholder: "https://mclo.gs/..."
