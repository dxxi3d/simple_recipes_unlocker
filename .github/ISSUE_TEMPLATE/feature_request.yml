name: Feature Request
description: Suggest an idea or enhancement for this mod
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for this mod? Let us know!
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: What would you like to see added or changed?
    validations:
      required: true
